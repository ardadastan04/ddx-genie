[project]
name = "smt-trial-matching"
version = "0.1.0"
description = "Conversational clinical-trial matching with SMT state (CS224V)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "z3-solver>=4.12",
    "openai>=1.50.0",
    "google-auth>=2.35.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smt_trial_matching", "smtstate"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
