# Main comparison on the test split (solver only, no LLM). Run ONCE per final system, only after the project lead's OK:
#   uv run python -m smt_trial_matching.experiment --config configs/main_test.yaml --confirmed
run_id: main_test
split: test
budget: 30
keys: [gpt5_oracle, gpt5mini]
reference: greedy_smt
policies:
  - no_questions
  - random_stop
  - greedy_smt
  - smt_trial_matching.policies:answerable_informative
  - smt_trial_matching.policies:oracle_answerable_greedy      # oracle: reads the key (greedy scoring)
  - smt_trial_matching.policies:answerable_informative_oracle # oracle: reads the key (our scoring)
